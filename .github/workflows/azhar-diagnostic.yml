name: Al-Azhar directory diagnostic

on:
  push:
    branches:
      - data-acquisition-egypt
    paths:
      - ".github/workflows/azhar-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install diagnostic dependencies
        run: pip install requests beautifulsoup4
      - name: Inspect one public institute detail page
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          u='https://azhar.gov.eg/IDSC/InstGuide/Guide_Resault.aspx?id=10119101'
          r=requests.get(u,headers={'User-Agent':'EduHubResearchBot/0.3 diagnostic'},timeout=60); r.raise_for_status()
          s=BeautifulSoup(r.text,'html.parser')
          print('TITLE',s.title.get_text(' ',strip=True) if s.title else None)
          for x in s.find_all('input'):
              typ=(x.get('type') or 'text').lower()
              if typ=='hidden': continue
              par=x.find_parent(['tr','div','td'])
              ptxt=' '.join(par.get_text(' ',strip=True).split()) if par else ''
              print('INPUT',{'type':typ,'name':x.get('name'),'id':x.get('id'),'value':x.get('value')},'PARENT=',ptxt[:500])
          for a in s.find_all('a',href=True):
              if 'map' in a.get('href','').lower() or 'google' in a.get('href','').lower(): print('MAP',a.get('href'))
          for ti,t in enumerate(s.find_all('table')):
              rows=[]
              for tr in t.find_all('tr')[:20]: rows.append([' '.join(c.get_text(' ',strip=True).split()) for c in tr.find_all(['th','td'])])
              print('TABLE',ti,rows[:20])
          PY
