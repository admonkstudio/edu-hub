name: EDU-DATA-2 International Registry

on:
  push:
    branches:
      - edu-data-2-international-registry
    paths:
      - 'tools/data-acquisition/international/**'
      - 'infra/owned-data/001_raw_archive.sql'
      - 'infra/owned-data/004_national_registry_layers.sql'
      - 'infra/owned-data/005_international_registry.sql'
      - 'infra/owned-data/006_bilingual_completion.sql'
      - 'docs/EDU-DATA-2-INTERNATIONAL-REGISTRY.md'
      - 'docs/DATABASE-COMPLETION-PLAN.md'
      - 'docs/SOURCE-USAGE-POLICY.md'
      - '.github/workflows/edu-data-2-international-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Validate international registry contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install acquisition dependencies
        run: pip install requests beautifulsoup4
      - name: Compile acquisition tools
        run: |
          python -m py_compile tools/data-acquisition/international/acquire_ib_egypt.py
          python -m py_compile tools/data-acquisition/international/acquire_scu_foreign_branches.py
          python -m py_compile tools/data-acquisition/international/build_authoritative_seed.py
          python -m py_compile tools/data-acquisition/international/build_candidate_universe.py
          python -m py_compile tools/data-acquisition/international/prepare_import_package.py
          python -m py_compile tools/data-acquisition/international/plan_identity_reconciliation.py
          python -m py_compile tools/data-acquisition/international/test_identity_reconciliation.py
          python -m py_compile tools/data-acquisition/international/discover_wikimedia_media.py
          python -m py_compile tools/data-acquisition/international/test_acquisition.py
      - name: Validate source registry and authoritative snapshots
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          registry = json.loads(Path('tools/data-acquisition/international/source_registry.json').read_text(encoding='utf-8'))
          assert registry['scope'] == 'egypt_international_education'
          ids = [row['source_id'] for row in registry['sources']]
          assert len(ids) == len(set(ids))
          for required in (
              'ib_world_schools_egypt',
              'uk_dfe_bso_egypt_2026_08',
              'french_homologation_2026_2027',
              'kmk_german_schools_2026_04',
              'scu_foreign_university_branches',
              'msche_auc',
              'wikimedia_commons',
              'edarabia_egypt',
              'legacy_v7_archive',
          ):
              assert required in ids
          assert all('auto_eligibility' in row for row in registry['sources'])
          edarabia = next(row for row in registry['sources'] if row['source_id'] == 'edarabia_egypt')
          assert edarabia['auto_eligibility'] is False
          assert edarabia['acquisition_mode'] == 'manual_reference_only_due_terms'
          assert 'do_not_systematically_copy' in edarabia['storage_policy']
          bso_source = next(row for row in registry['sources'] if row['source_id'] == 'uk_dfe_bso_egypt_2026_08')
          assert bso_source['authority_class'] == 'foreign_government'
          assert bso_source['expected_current_count'] == 11
          assert bso_source['auto_eligibility'] is False

          seed_dir = Path('tools/data-acquisition/international/seeds')
          ib = json.loads((seed_dir/'ib-egypt-directory-2026-09-14.json').read_text(encoding='utf-8'))
          ib_detail = json.loads((seed_dir/'ib-detail-evidence-2026-09-14.json').read_text(encoding='utf-8'))
          bso = json.loads((seed_dir/'uk-dfe-bso-egypt-2026-08-26.json').read_text(encoding='utf-8'))
          bso_detail = json.loads((seed_dir/'uk-dfe-gias-bso-egypt-detail-2026-09-14.json').read_text(encoding='utf-8'))
          fr = json.loads((seed_dir/'french-homologation-egypt-2026-2027.json').read_text(encoding='utf-8'))
          de = json.loads((seed_dir/'german-kmk-egypt-2026-04.json').read_text(encoding='utf-8'))
          scu = json.loads((seed_dir/'scu-foreign-university-branches-2026-09-14.json').read_text(encoding='utf-8'))
          auc = json.loads((seed_dir/'auc-international-evidence-2026-09-14.json').read_text(encoding='utf-8'))
          media = json.loads((seed_dir/'wikimedia-media-verified-2026-09-14.json').read_text(encoding='utf-8'))
          assert len(ib['schools']) == ib['directory_count_observed'] == 54
          assert ib['count_conflict_requires_review'] is True
          assert len(ib_detail['records']) == ib_detail['records_count'] == 7
          assert ib_detail['eligible_private'] == 4
          assert ib_detail['excluded_state'] == 3
          assert len(bso['records']) == bso['records_count'] == 11
          assert bso['list_updated'] == '2026-08-26'
          assert len(bso_detail['records']) == bso_detail['records_count'] == 11
          assert len({row['urn'] for row in bso_detail['records']}) == 11
          assert all(row['establishment_status'] == 'open' for row in bso_detail['records'])
          assert len(fr['records']) == fr['records_count'] == 17
          assert len(de['records']) == de['records_count'] == 4
          assert len(scu['records']) == scu['records_count'] == 9
          assert auc['institution']['scope_state'] == 'eligible'
          assert len(media['assets']) == media['assets_count'] == 5
          assert all(row['public_use_allowed'] is True for row in media['assets'])
          assert all(row['rights_basis'] for row in media['assets'])
          assert all(row['identity_match_state'] == 'verified_by_file_description' for row in media['assets'])
          print(f"validated {len(ids)} registered sources, 96 source rows, 11 BSO/GIAS detail rows, 7 IB detail decisions and 5 reviewed media assets")
          PY
      - name: Test live-parser and scope boundaries
        run: python tools/data-acquisition/international/test_acquisition.py
      - name: Test review-only identity matcher
        run: python tools/data-acquisition/international/test_identity_reconciliation.py

  build-seed:
    name: Build authoritative seed, candidate universe and import package
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build deterministic source candidates
        run: python tools/data-acquisition/international/build_authoritative_seed.py --output-dir artifacts/international
      - name: Build D2.1 candidate universe and bilingual gaps
        run: python tools/data-acquisition/international/build_candidate_universe.py
      - name: Prepare provenance-safe import package
        run: python tools/data-acquisition/international/prepare_import_package.py --output-dir artifacts/international/import-package
      - name: Generate review-only identity proposals
        run: python tools/data-acquisition/international/plan_identity_reconciliation.py
      - name: Verify seed safety and counts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/international/authoritative-source-summary.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['source_rows'] == 96
          assert data['source_counts']['uk_dfe_bso_egypt_2026_08'] == 11
          assert data['eligible_source_rows'] == 35
          assert data['candidate_source_rows'] == 58
          assert data['excluded_source_rows'] == 3
          assert data['ib_detail_rows_applied'] == 7
          assert data['bso_detail_rows_applied'] == 11
          assert data['unique_institutions_claimed'] is None
          assert data['identity_reconciliation_required'] is True
          assert data['database_mutation_performed'] is False
          assert data['public_promotion_performed'] is False
          assert data['ib_directory_country_summary_conflict']['review_required'] is True

          universe = json.loads(Path('artifacts/international/candidate-universe/candidate-universe-summary.json').read_text(encoding='utf-8'))
          assert universe['source_record_count'] == 96
          assert universe['source_counts']['uk_dfe_bso_egypt_2026_08'] == 11
          assert universe['english_name_present'] == 96
          assert universe['arabic_name_present'] == 9
          assert universe['bilingual_name_gap_count'] == 87
          assert universe['cross_source_overlap_review_groups'] == 3
          assert universe['unique_institutions_claimed'] is None
          assert universe['canonical_institutions_created'] == 0
          assert universe['automatic_merges_performed'] == 0
          assert universe['public_projection_rows_created'] == 0
          assert universe['presentation_runtime_dependency'] is None

          manifest = json.loads(Path('artifacts/international/import-package/manifest.json').read_text(encoding='utf-8'))
          assert manifest['sources'] == 6
          assert manifest['raw_records'] == 96
          assert manifest['staging_candidates'] == 96
          assert manifest['reviewed_media_assets'] == 5
          assert manifest['canonical_institutions_created'] == 0
          assert manifest['identity_merges_performed'] == 0
          assert manifest['public_projection_rows_created'] == 0
          assert len(manifest['checksums']) == 4

          proposals = [json.loads(line) for line in Path('artifacts/international/import-package/identity-review-proposals.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          assert len(proposals) == 5
          assert all(row['decision'] == 'needs_review' for row in proposals)
          assert all(row['left_source_id'] != row['right_source_id'] for row in proposals)
          assert all(row['matcher_version'] == 'edu-data-2-name-v2' for row in proposals)
          assert not any(
              {row['left_name'], row['right_name']} == {'British International School, Cairo', 'Egypt British International School'}
              for row in proposals
          )
          print(json.dumps({'source_summary': data, 'candidate_universe': universe, 'import_manifest': manifest, 'identity_review_proposals': len(proposals)}, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: edu-data-2-authoritative-seed
          path: artifacts/international/
          if-no-files-found: error

  schema:
    name: Validate bilingual international PostgreSQL reference schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: eduhub_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eduhub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: eduhub_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update -qq && sudo apt-get install -y postgresql-client
      - name: Apply clean registry migrations
        run: |
          psql -v ON_ERROR_STOP=1 -f infra/owned-data/001_raw_archive.sql
          psql -v ON_ERROR_STOP=1 -f infra/owned-data/004_national_registry_layers.sql
          psql -v ON_ERROR_STOP=1 -f infra/owned-data/005_international_registry.sql
          psql -v ON_ERROR_STOP=1 -f infra/owned-data/006_bilingual_completion.sql
      - name: Assert international schema contract
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          do $$
          begin
            assert to_regclass('edu_raw.raw_records') is not null, 'missing edu_raw.raw_records';
            assert to_regclass('edu_staging.entity_candidates') is not null, 'missing staging candidates';
            assert to_regclass('edu_core.institutions') is not null, 'missing institutions';
            assert to_regclass('edu_core.international_eligibility') is not null, 'missing international eligibility';
            assert to_regclass('edu_core.campuses') is not null, 'missing campuses';
            assert to_regclass('edu_core.campus_localizations') is not null, 'missing bilingual campus localizations';
            assert to_regclass('edu_core.institution_aliases') is not null, 'missing institution aliases';
            assert to_regclass('edu_core.education_levels') is not null, 'missing education levels';
            assert to_regclass('edu_core.campus_level_offerings') is not null, 'missing campus level offerings';
            assert to_regclass('edu_core.facilities') is not null, 'missing facilities taxonomy';
            assert to_regclass('edu_core.campus_facilities') is not null, 'missing campus facilities';
            assert to_regclass('edu_core.admission_requirements') is not null, 'missing admission requirements';
            assert to_regclass('edu_core.academic_unit_localizations') is not null, 'missing academic unit localizations';
            assert to_regclass('edu_core.program_localizations') is not null, 'missing program localizations';
            assert to_regclass('edu_core.institution_media_localizations') is not null, 'missing media localizations';
            assert to_regclass('edu_core.evidence_assertions') is not null, 'missing universal evidence assertions';
            assert to_regclass('edu_core.international_profile_completeness') is not null, 'missing profile completeness';
            assert exists(select 1 from pg_extension where extname='postgis'), 'postgis not enabled';
          end $$;
          SQL
          psql -Atc "select code from edu_core.curricula order by code"
          psql -Atc "select code from edu_core.education_levels order by sort_order"
          psql -Atc "select code from edu_core.facilities order by code"

  note-live-refresh:
    name: Record live-refresh boundary
    needs: contract
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Authoritative snapshots are refreshed through browser-capable/source-appropriate acquisition paths."
          echo "IB currently returns HTTP 403 to GitHub-hosted direct Python requests, so a 403 is not treated as source absence."
          echo "Edarabia is reference-only under its published terms unless written reuse permission is obtained."
          echo "UK DfE BSO is authoritative international-model evidence; private/independent ownership is still reviewed separately."
          echo "Live fetch scripts remain available for suitable environments, but deterministic CI uses dated evidence snapshots."
