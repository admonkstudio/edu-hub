name: EDU-DATA-2 Identity Review

on:
  push:
    branches:
      - edu-data-2-international-registry
    paths:
      - 'tools/data-acquisition/international/build_authoritative_seed.py'
      - 'tools/data-acquisition/international/build_accreditor_expansion.py'
      - 'tools/data-acquisition/international/validate_identity_review_decisions.py'
      - 'tools/data-acquisition/international/seeds/identity-review-decisions-2026-09-15.json'
      - '.github/workflows/edu-data-2-identity-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: Validate reviewed cross-source identities and division scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile review tools
        run: |
          python -m py_compile tools/data-acquisition/international/build_authoritative_seed.py
          python -m py_compile tools/data-acquisition/international/build_accreditor_expansion.py
          python -m py_compile tools/data-acquisition/international/validate_identity_review_decisions.py
      - name: Build deterministic base and accreditor-expanded universe
        run: |
          python tools/data-acquisition/international/build_authoritative_seed.py --output-dir artifacts/international
          python tools/data-acquisition/international/build_accreditor_expansion.py
      - name: Validate reviewed relationship decisions
        run: python tools/data-acquisition/international/validate_identity_review_decisions.py
      - name: Assert D2.2 review safety contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/international/identity-review/identity-review-summary.json')
          summary = json.loads(p.read_text(encoding='utf-8'))
          assert summary['source_universe_rows'] == 106
          assert summary['review_groups'] == 9
          assert summary['reviewed_source_rows'] == 20
          assert summary['same_institution_groups'] == 7
          assert summary['division_scoped_groups'] == 2
          assert summary['missing_source_rows'] == 0
          assert summary['name_drift_rows'] == 0
          assert summary['canonical_institutions_created'] == 0
          assert summary['canonical_merges_performed'] == 0
          assert summary['public_projection_rows_created'] == 0
          assert summary['database_mutation_performed'] is False
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: edu-data-2-identity-review
          path: artifacts/international/identity-review/
          if-no-files-found: error
