name: EDU-DATA-2 Campus Review

on:
  push:
    branches:
      - edu-data-2-international-registry
    paths:
      - 'tools/data-acquisition/international/build_reviewed_campus_artifacts.py'
      - 'tools/data-acquisition/international/build_reviewed_canonical_artifacts.py'
      - 'tools/data-acquisition/international/apply_ib_detail_batches.py'
      - 'tools/data-acquisition/international/seeds/campus-review-decisions-2026-09-15.json'
      - 'tools/data-acquisition/international/seeds/identity-review-decisions-2026-09-15.json'
      - '.github/workflows/edu-data-2-campus-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review:
    name: Validate current-campus evidence without assuming complete campus structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile campus and dependency builders
        run: |
          python -m py_compile tools/data-acquisition/international/build_authoritative_seed.py
          python -m py_compile tools/data-acquisition/international/apply_ib_detail_batches.py
          python -m py_compile tools/data-acquisition/international/build_accreditor_expansion.py
          python -m py_compile tools/data-acquisition/international/build_reviewed_canonical_artifacts.py
          python -m py_compile tools/data-acquisition/international/build_reviewed_campus_artifacts.py
      - name: Build current source universe and reviewed institution drafts
        run: |
          python tools/data-acquisition/international/build_authoritative_seed.py --output-dir artifacts/international
          python tools/data-acquisition/international/apply_ib_detail_batches.py
          python tools/data-acquisition/international/build_accreditor_expansion.py \
            --base artifacts/international/ib-incremental/authoritative-source-candidates-with-incremental-ib.jsonl \
            --output-dir artifacts/international/campus-review/accreditor-expansion
          python tools/data-acquisition/international/build_reviewed_canonical_artifacts.py \
            --universe artifacts/international/campus-review/accreditor-expansion/authoritative-source-candidates-with-accreditors.jsonl \
            --output-dir artifacts/international/campus-review/reviewed-canonical-draft
      - name: Materialize reviewed current-campus evidence
        run: |
          python tools/data-acquisition/international/build_reviewed_campus_artifacts.py \
            --output-dir artifacts/international/campus-review/reviewed-campus-draft
      - name: Assert campus evidence and identity alignment
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/international/campus-review')
          institution_rows = [json.loads(line) for line in (root/'reviewed-canonical-draft/reviewed-institution-drafts.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          campus_rows = [json.loads(line) for line in (root/'reviewed-campus-draft/reviewed-current-campus-drafts.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          states = [json.loads(line) for line in (root/'reviewed-campus-draft/campus-structure-review.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          summary = json.loads((root/'reviewed-campus-draft/reviewed-campus-draft-summary.json').read_text(encoding='utf-8'))

          assert len(institution_rows) == 9
          assert len(campus_rows) == len(states) == 9
          institution_ids = {row['draft_institution_id'] for row in institution_rows}
          assert len(institution_ids) == 9
          assert {row['draft_institution_id'] for row in campus_rows} == institution_ids
          assert {row['draft_institution_id'] for row in states} == institution_ids
          assert len({row['draft_campus_id'] for row in campus_rows}) == 9

          assert summary['reviewed_identity_groups'] == 9
          assert summary['reviewed_current_campus_records'] == 9
          assert summary['identity_groups_with_current_campus_evidence'] == 9
          assert summary['campus_structure_complete_records'] == 0
          assert summary['additional_current_campuses_ruled_out_records'] == 0
          assert summary['automatic_additional_campus_inference_performed'] is False
          assert summary['canonical_campus_rows_created'] == 0
          assert summary['canonical_database_rows_written'] == 0
          assert summary['runtime_database_mutation_performed'] is False
          assert summary['public_projection_rows_created'] == 0

          assert all(row['current_campus_evidence_reviewed'] is True for row in campus_rows)
          assert all(row['campus_structure_complete'] is False for row in campus_rows)
          assert all(row['additional_current_campuses_ruled_out'] is False for row in campus_rows)
          assert all(row['canonical_campus_created'] is False for row in campus_rows)
          assert all(row['canonical_database_write_performed'] is False for row in campus_rows)
          assert all(row['public_projection_performed'] is False for row in campus_rows)
          assert all(row['campus_structure_state'] == 'at_least_one_current_campus_reviewed_structure_not_exhaustive' for row in states)
          assert all(row['further_campus_review_required'] is True for row in states)

          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: edu-data-2-campus-review
          path: artifacts/international/campus-review/
          if-no-files-found: error
