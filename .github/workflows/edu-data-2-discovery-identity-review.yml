name: EDU-DATA-2 Discovery Identity Review

on:
  push:
    branches:
      - edu-data-2-international-registry
    paths:
      - 'tools/data-acquisition/international/build_authoritative_seed.py'
      - 'tools/data-acquisition/international/apply_ib_detail_batches.py'
      - 'tools/data-acquisition/international/apply_bso_scope_review.py'
      - 'tools/data-acquisition/international/build_accreditor_expansion.py'
      - 'tools/data-acquisition/international/apply_accreditor_scope_review.py'
      - 'tools/data-acquisition/international/build_extended_identity_artifacts.py'
      - 'tools/data-acquisition/international/build_hierarchy_review_artifacts.py'
      - 'tools/data-acquisition/international/build_incremental_identity_review_artifacts.py'
      - 'tools/data-acquisition/international/build_british_council_browser_discovery.py'
      - 'tools/data-acquisition/international/apply_british_council_primary_scope_review.py'
      - 'tools/data-acquisition/international/build_discovery_identity_review_artifacts.py'
      - 'tools/data-acquisition/international/seeds/identity-review-decisions-2026-09-15.json'
      - 'tools/data-acquisition/international/seeds/single-source-identity-decisions-2026-09-15.json'
      - 'tools/data-acquisition/international/seeds/single-source-identity-decisions-*-batch*.json'
      - 'tools/data-acquisition/international/seeds/division-review-decisions-2026-09-15.json'
      - 'tools/data-acquisition/international/seeds/hierarchy-review-decisions-2026-09-15.json'
      - 'tools/data-acquisition/international/seeds/british-council-browser-discovery-*.json'
      - 'tools/data-acquisition/international/seeds/british-council-primary-scope-review-*.json'
      - 'tools/data-acquisition/international/seeds/discovered-identity-decisions-*.json'
      - '.github/workflows/edu-data-2-discovery-identity-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery-identity:
    name: Validate explicit identities for qualified discovery rows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile data tools
        run: |
          python -m py_compile tools/data-acquisition/international/build_authoritative_seed.py
          python -m py_compile tools/data-acquisition/international/apply_ib_detail_batches.py
          python -m py_compile tools/data-acquisition/international/apply_bso_scope_review.py
          python -m py_compile tools/data-acquisition/international/build_accreditor_expansion.py
          python -m py_compile tools/data-acquisition/international/apply_accreditor_scope_review.py
          python -m py_compile tools/data-acquisition/international/build_extended_identity_artifacts.py
          python -m py_compile tools/data-acquisition/international/build_hierarchy_review_artifacts.py
          python -m py_compile tools/data-acquisition/international/build_incremental_identity_review_artifacts.py
          python -m py_compile tools/data-acquisition/international/build_british_council_browser_discovery.py
          python -m py_compile tools/data-acquisition/international/apply_british_council_primary_scope_review.py
          python -m py_compile tools/data-acquisition/international/build_discovery_identity_review_artifacts.py
      - name: Rebuild current 106-row scope-reviewed universe
        run: |
          python tools/data-acquisition/international/build_authoritative_seed.py --output-dir artifacts/international
          python tools/data-acquisition/international/apply_ib_detail_batches.py
          python tools/data-acquisition/international/apply_bso_scope_review.py
          python tools/data-acquisition/international/build_accreditor_expansion.py \
            --base artifacts/international/bso-scope-review/authoritative-source-candidates-with-bso-scope-review.jsonl \
            --output-dir artifacts/international/bso-scope-review/accreditor-expansion
          python tools/data-acquisition/international/apply_accreditor_scope_review.py
      - name: Rebuild accepted original-universe D2.2 identity chain
        run: |
          python tools/data-acquisition/international/build_extended_identity_artifacts.py
          python tools/data-acquisition/international/build_hierarchy_review_artifacts.py
          python tools/data-acquisition/international/build_incremental_identity_review_artifacts.py
      - name: Rebuild British Council discovery qualification layer
        run: |
          python tools/data-acquisition/international/build_british_council_browser_discovery.py
          python tools/data-acquisition/international/apply_british_council_primary_scope_review.py
      - name: Materialize explicit discovery identities
        run: python tools/data-acquisition/international/build_discovery_identity_review_artifacts.py
      - name: Assert discovery identity safety contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/international/discovery-identity-review')
          summary = json.loads((root/'discovery-identity-summary.json').read_text(encoding='utf-8'))
          institutions = [json.loads(line) for line in (root/'reviewed-institution-drafts.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          divisions = [json.loads(line) for line in (root/'reviewed-school-division-drafts.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          memberships = [json.loads(line) for line in (root/'discovered-source-memberships.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          original_queue = [json.loads(line) for line in (root/'original-unreviewed-source-queue.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          discovery_queue = [json.loads(line) for line in (root/'unqualified-discovery-queue.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          qualified_queue = [json.loads(line) for line in (root/'qualified-discovery-identity-queue.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]

          assert summary['base_reviewed_institution_drafts'] == 24
          assert summary['discovery_identity_review_batches'] == 1
          assert summary['new_discovered_identity_drafts'] == len(memberships) == 2
          assert summary['reviewed_institution_drafts'] == len(institutions) == 26
          assert summary['reviewed_division_drafts'] == len(divisions) == 10
          assert summary['base_reviewed_original_source_rows'] == 35
          assert summary['reviewed_discovery_source_rows'] == 2
          assert summary['reviewed_source_or_lead_rows'] == 37
          assert summary['original_unreviewed_source_rows'] == len(original_queue) == 71
          assert summary['unqualified_discovery_rows'] == len(discovery_queue) == 68
          assert summary['qualified_discovery_rows_pending_identity_review'] == len(qualified_queue) == 0
          assert summary['full_universe_unique_institution_count_claimed'] is None
          assert summary['absence_of_match_treated_as_uniqueness_proof'] is False
          assert summary['unqualified_discovery_rows_entered_identity_review'] is False
          assert summary['automatic_merges_performed'] == 0
          assert summary['canonical_database_rows_written'] == 0
          assert summary['runtime_database_mutation_performed'] is False
          assert summary['public_projection_rows_created'] == 0

          expected = {'kings-school-the-crown', 'international-school-choueifat-cairo'}
          assert {row['review_identity_key'] for row in memberships} == expected
          by_key = {row['review_identity_key']: row for row in institutions}
          assert expected <= set(by_key)
          assert all(by_key[key]['uniqueness_inferred_from_absence_of_match'] is False for key in expected)
          assert len({row['draft_institution_id'] for row in institutions}) == len(institutions)

          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: edu-data-2-discovery-identity-review
          path: artifacts/international/discovery-identity-review/
          if-no-files-found: error
