name: EDU-DATA-1 Registry Contract

on:
  push:
    branches:
      - edu-data-1-national-registry
    paths:
      - 'docs/EDU-DATA-1-NATIONAL-REGISTRY.md'
      - 'docs/EDU-DATA-1-BASELINE-*.md'
      - 'docs/requests/**'
      - 'infra/owned-data/004_national_registry_layers.sql'
      - 'tools/data-acquisition/registry/**'
      - 'tools/data-acquisition/recovery/**'
      - 'tools/data-acquisition/emis_local_capture.py'
      - 'tools/data-acquisition/scrape_scu.py'
      - 'tools/data-acquisition/scrape_azhar.py'
      - 'tools/data-acquisition/scrape_mohesr_private.py'
      - 'tools/data-acquisition/scrape_mohesr_technical.py'
      - '.github/workflows/edu-data-1-contract.yml'
  pull_request:
    branches:
      - data-acquisition-egypt-v3
    paths:
      - 'docs/EDU-DATA-1-NATIONAL-REGISTRY.md'
      - 'docs/EDU-DATA-1-BASELINE-*.md'
      - 'docs/requests/**'
      - 'infra/owned-data/004_national_registry_layers.sql'
      - 'tools/data-acquisition/registry/**'
      - 'tools/data-acquisition/recovery/**'
      - 'tools/data-acquisition/emis_local_capture.py'
      - 'tools/data-acquisition/scrape_scu.py'
      - 'tools/data-acquisition/scrape_azhar.py'
      - 'tools/data-acquisition/scrape_mohesr_private.py'
      - 'tools/data-acquisition/scrape_mohesr_technical.py'
      - '.github/workflows/edu-data-1-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Validate registry contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source and alias registry contracts
        run: |
          mkdir -p artifacts/edu-data-1
          python tools/data-acquisition/registry/validate_registry.py \
            --report artifacts/edu-data-1/source-registry-validation.json
      - name: Compile registry and local-acquisition tools
        run: |
          python -m py_compile tools/data-acquisition/registry/validate_registry.py
          python -m py_compile tools/data-acquisition/registry/build_staging_seed.py
          python -m py_compile tools/data-acquisition/registry/test_build_staging_seed.py
          python -m py_compile tools/data-acquisition/registry/plan_core_seed.py
          python -m py_compile tools/data-acquisition/registry/test_plan_core_seed.py
          python -m py_compile tools/data-acquisition/registry/reconcile_higher_ed.py
          python -m py_compile tools/data-acquisition/registry/test_reconcile_higher_ed.py
          python -m py_compile tools/data-acquisition/registry/prepare_official_export.py
          python -m py_compile tools/data-acquisition/registry/test_prepare_official_export.py
          python -m py_compile tools/data-acquisition/emis_local_capture.py
          python -m py_compile tools/data-acquisition/scrape_mohesr_private.py
          python -m py_compile tools/data-acquisition/scrape_mohesr_technical.py
      - name: Enforce staging coverage safety rules
        run: python tools/data-acquisition/registry/test_build_staging_seed.py
      - name: Enforce core identity planning safety rules
        run: python tools/data-acquisition/registry/test_plan_core_seed.py
      - name: Enforce higher-education reconciliation safety rules
        run: python tools/data-acquisition/registry/test_reconcile_higher_ed.py
      - name: Enforce official export intake safety rules
        run: python tools/data-acquisition/registry/test_prepare_official_export.py
      - uses: actions/upload-artifact@v4
        with:
          name: edu-data-1-contract-report
          path: artifacts/edu-data-1/source-registry-validation.json
          if-no-files-found: error
          retention-days: 30

  official-source-smoke:
    name: Probe accessible official registries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install acquisition dependencies
        run: pip install -r tools/data-acquisition/requirements.txt
      - name: Refresh SCU higher-education snapshot
        run: |
          mkdir -p artifacts/edu-data-1
          python tools/data-acquisition/scrape_scu.py
          cp tools/data-acquisition/seeds/scu_higher_ed_snapshot.csv artifacts/edu-data-1/
          cp tools/data-acquisition/seeds/scu_higher_ed_snapshot.csv.report.json artifacts/edu-data-1/
      - name: Validate SCU result is substantive
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('tools/data-acquisition/seeds/scu_higher_ed_snapshot.csv.report.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          total = int(data.get('total', 0))
          print(json.dumps(data, ensure_ascii=False, indent=2))
          if total < 250:
              raise SystemExit(f'SCU smoke acquisition unexpectedly small: {total}')
          PY
      - name: Acquire current MOHESR private-institute sector registry
        run: |
          python tools/data-acquisition/scrape_mohesr_private.py \
            --output artifacts/edu-data-1/mohesr_private_institutes.jsonl \
            --report artifacts/edu-data-1/mohesr_private_institutes_report.json \
            --page-text artifacts/edu-data-1/mohesr_private_page.txt
      - name: Acquire current MOHESR technical hierarchy
        run: |
          python tools/data-acquisition/scrape_mohesr_technical.py \
            --parents-output artifacts/edu-data-1/mohesr_technological_colleges.jsonl \
            --institutes-output artifacts/edu-data-1/mohesr_technical_institutes.jsonl \
            --report artifacts/edu-data-1/mohesr_technical_report.json
      - name: Build SCU-MOHESR reconciliation and hierarchy proposals
        run: |
          python tools/data-acquisition/registry/reconcile_higher_ed.py \
            --scu-csv tools/data-acquisition/seeds/scu_higher_ed_snapshot.csv \
            --mohesr-private artifacts/edu-data-1/mohesr_private_institutes.jsonl \
            --mohesr-technical-parents artifacts/edu-data-1/mohesr_technological_colleges.jsonl \
            --mohesr-technical-institutes artifacts/edu-data-1/mohesr_technical_institutes.jsonl \
            --out-dir artifacts/edu-data-1/higher-ed-reconciliation
      - name: Validate reconciliation remains proposal-only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/edu-data-1/higher-ed-reconciliation/reconciliation_report.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          print(json.dumps(data, ensure_ascii=False, indent=2))
          if int(data.get('scu_private_source_rows', 0)) < 150:
              raise SystemExit('SCU private-institute reconciliation input unexpectedly small')
          if int(data.get('mohesr_sector_occurrences', 0)) < 170:
              raise SystemExit('MOHESR private-institute reconciliation input unexpectedly small')
          if int(data.get('technical_parent_source_rows', 0)) != 8:
              raise SystemExit('MOHESR technical hierarchy must contain exactly 8 source parent colleges')
          if int(data.get('technical_institute_source_rows', 0)) != 44:
              raise SystemExit('MOHESR technical hierarchy must contain exactly 44 source institutes')
          if int(data.get('technical_hierarchy_source_backed_proposals', 0)) != 44:
              raise SystemExit('Every acquired technical institute must retain a source-backed parent proposal')
          if int(data.get('technical_hierarchy_invalid_links', -1)) != 0:
              raise SystemExit('MOHESR technical hierarchy contains unresolved parent-link integrity errors')
          if data.get('automatic_identity_acceptances') != 0 or data.get('automatic_relationship_acceptances') != 0:
              raise SystemExit('Reconciliation must not auto-accept identities or hierarchy relationships')
          if data.get('edu_core_rows_created') != 0 or data.get('core_mutation_performed') is not False:
              raise SystemExit('Reconciliation must not mutate edu_core')
          if data.get('public_promotion_performed') is not False:
              raise SystemExit('Reconciliation must not promote public data')
          PY
      - name: Probe Al-Azhar live adapter with a bounded sample
        run: |
          python tools/data-acquisition/scrape_azhar.py \
            --output artifacts/edu-data-1/azhar-smoke.jsonl \
            --max-governorates 1 \
            --max-admins-per-governorate 1 \
            --max-profiles 5 \
            --delay 0.5
      - name: Validate Al-Azhar smoke result
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('artifacts/edu-data-1/azhar-smoke.jsonl')
          rows = [line for line in p.read_text(encoding='utf-8').splitlines() if line.strip()]
          print({'azhar_smoke_records': len(rows)})
          if not rows:
              raise SystemExit('Al-Azhar smoke acquisition returned zero records')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: edu-data-1-official-source-smoke
          path: artifacts/edu-data-1/
          if-no-files-found: error
          retention-days: 30
