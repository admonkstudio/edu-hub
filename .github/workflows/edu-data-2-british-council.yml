name: EDU-DATA-2 British Council Adapter Contract

on:
  push:
    branches:
      - edu-data-2-international-registry
    paths:
      - 'tools/data-acquisition/international/acquire_british_council_partner_schools.py'
      - '.github/workflows/edu-data-2-british-council.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Validate browser/local PDF adapter contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF acquisition dependencies
        run: pip install requests pdfplumber
      - name: Compile adapter
        run: python -m py_compile tools/data-acquisition/international/acquire_british_council_partner_schools.py
      - name: Record acquisition boundary
        run: |
          echo "The September 2026 British Council PDF is browser-accessible but currently returns HTTP 403 to GitHub-hosted direct Python requests."
          echo "Use the adapter with --pdf-path after a browser/local download, or direct mode only in an environment the source permits."
          echo "Partner School status remains discovery/contact evidence only; this workflow grants zero international eligibility and performs zero database/public mutation."
