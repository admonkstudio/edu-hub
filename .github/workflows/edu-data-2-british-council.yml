name: EDU-DATA-2 British Council Discovery

on:
  push:
    branches:
      - edu-data-2-international-registry
    paths:
      - 'tools/data-acquisition/international/acquire_british_council_partner_schools.py'
      - 'tools/data-acquisition/international/build_british_council_browser_discovery.py'
      - 'tools/data-acquisition/international/apply_british_council_primary_scope_review.py'
      - 'tools/data-acquisition/international/build_candidate_universe.py'
      - 'tools/data-acquisition/international/build_authoritative_seed.py'
      - 'tools/data-acquisition/international/apply_ib_detail_batches.py'
      - 'tools/data-acquisition/international/apply_bso_scope_review.py'
      - 'tools/data-acquisition/international/build_accreditor_expansion.py'
      - 'tools/data-acquisition/international/apply_accreditor_scope_review.py'
      - 'tools/data-acquisition/international/seeds/british-council-browser-discovery-*.json'
      - 'tools/data-acquisition/international/seeds/british-council-primary-scope-review-*.json'
      - 'tools/data-acquisition/international/seeds/ib-detail-evidence-*-batch*.json'
      - 'tools/data-acquisition/international/seeds/bso-scope-review-2026-09-15.json'
      - 'tools/data-acquisition/international/seeds/accreditor-scope-review-2026-09-15.json'
      - '.github/workflows/edu-data-2-british-council.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery:
    name: Validate Partner Schools discovery and primary re-sourcing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF acquisition dependencies
        run: pip install requests pdfplumber
      - name: Compile discovery tools
        run: |
          python -m py_compile tools/data-acquisition/international/acquire_british_council_partner_schools.py
          python -m py_compile tools/data-acquisition/international/build_british_council_browser_discovery.py
          python -m py_compile tools/data-acquisition/international/apply_british_council_primary_scope_review.py
          python -m py_compile tools/data-acquisition/international/build_candidate_universe.py
          python -m py_compile tools/data-acquisition/international/build_authoritative_seed.py
          python -m py_compile tools/data-acquisition/international/apply_ib_detail_batches.py
          python -m py_compile tools/data-acquisition/international/apply_bso_scope_review.py
          python -m py_compile tools/data-acquisition/international/build_accreditor_expansion.py
          python -m py_compile tools/data-acquisition/international/apply_accreditor_scope_review.py
      - name: Rebuild current 106-row scope-reviewed universe
        run: |
          python tools/data-acquisition/international/build_authoritative_seed.py --output-dir artifacts/international
          python tools/data-acquisition/international/apply_ib_detail_batches.py
          python tools/data-acquisition/international/apply_bso_scope_review.py
          python tools/data-acquisition/international/build_accreditor_expansion.py \
            --base artifacts/international/bso-scope-review/authoritative-source-candidates-with-bso-scope-review.jsonl \
            --output-dir artifacts/international/bso-scope-review/accreditor-expansion
          python tools/data-acquisition/international/apply_accreditor_scope_review.py
      - name: Materialize reviewed browser discovery batches
        run: python tools/data-acquisition/international/build_british_council_browser_discovery.py
      - name: Build raw expanded D2.1 discovery universe
        run: |
          python tools/data-acquisition/international/build_candidate_universe.py \
            --authoritative artifacts/international/accreditor-scope-review/reviewed-source-universe.jsonl \
            --lead-file artifacts/international/british-council-browser-discovery/british-council-browser-leads.jsonl \
            --output-dir artifacts/international/british-council-candidate-universe
      - name: Apply primary evidence scope review
        run: python tools/data-acquisition/international/apply_british_council_primary_scope_review.py
      - name: Build scope-reviewed expanded D2.1 universe
        run: |
          python tools/data-acquisition/international/build_candidate_universe.py \
            --authoritative artifacts/international/accreditor-scope-review/reviewed-source-universe.jsonl \
            --lead-file artifacts/international/british-council-primary-scope-review/british-council-leads-with-primary-review.jsonl \
            --output-dir artifacts/international/british-council-reviewed-candidate-universe
      - name: Assert discovery and primary-review safety contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          bc_root = Path('artifacts/international/british-council-browser-discovery')
          bc = json.loads((bc_root/'british-council-browser-summary.json').read_text(encoding='utf-8'))
          assert bc['reviewed_discovery_batches'] == 3
          assert bc['reviewed_discovery_rows'] == 105
          assert bc['rows_with_website_reference'] == 82
          assert bc['unique_institutions_claimed'] is None
          assert bc['international_eligibility_granted'] == 0
          assert bc['canonical_institutions_created'] == 0
          assert bc['automatic_merges_performed'] == 0
          assert bc['database_mutation_performed'] is False
          assert bc['public_projection_rows_created'] == 0
          assert bc['full_pdf_extraction_complete'] is False

          raw_root = Path('artifacts/international/british-council-candidate-universe')
          raw = json.loads((raw_root/'candidate-universe-summary.json').read_text(encoding='utf-8'))
          assert raw['source_record_count'] == 211
          assert raw['source_counts']['british_council_partner_schools_egypt_2026_09'] == 105
          assert raw['scope_or_lead_state_counts']['eligible'] == 103
          assert raw['scope_or_lead_state_counts']['excluded'] == 3
          assert raw['scope_or_lead_state_counts']['supporting_candidate'] == 105

          review_root = Path('artifacts/international/british-council-primary-scope-review')
          review = json.loads((review_root/'british-council-primary-scope-summary.json').read_text(encoding='utf-8'))
          assert review['source_rows'] == 105
          assert review['review_batches'] == 3
          assert review['reviewed_rows'] == 9
          assert review['eligible_rows'] == 9
          assert review['remaining_supporting_candidates'] == 96
          assert review['partner_status_treated_as_international_eligibility'] is False
          assert review['automatic_identity_creation_performed'] is False
          assert review['automatic_merges_performed'] == 0
          assert review['database_mutation_performed'] is False
          assert review['public_projection_rows_created'] == 0

          root = Path('artifacts/international/british-council-reviewed-candidate-universe')
          summary = json.loads((root/'candidate-universe-summary.json').read_text(encoding='utf-8'))
          assert summary['source_record_count'] == 211
          assert summary['source_counts']['british_council_partner_schools_egypt_2026_09'] == 105
          assert summary['scope_or_lead_state_counts']['eligible'] == 112
          assert summary['scope_or_lead_state_counts']['excluded'] == 3
          assert summary['scope_or_lead_state_counts']['supporting_candidate'] == 96
          assert summary['english_name_present'] == 211
          assert summary['bilingual_name_gap_count'] == 97
          assert summary['unique_institutions_claimed'] is None
          assert summary['canonical_institutions_created'] == 0
          assert summary['automatic_merges_performed'] == 0
          assert summary['database_mutation_performed'] is False
          assert summary['public_projection_rows_created'] == 0

          evidence = [json.loads(line) for line in (review_root/'primary-scope-review-evidence.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          assert {row['source_record_id'] for row in evidence} == {
              'bcps2026:kings-school-the-crown',
              'bcps2026:international-school-choueifat-cairo',
              'bcps2026:global-paradigm-baccalaureate-school',
              'bcps2026:capital-international-schools',
              'bcps2026:mount-international-school-community',
              'bcps2026:international-school-elite-education',
              'bcps2026:alsson-international-school-haraniya',
              'bcps2026:misr-language-schools',
              'bcps2026:new-giza-international-school-evolution',
          }
          print(json.dumps({'browser_discovery': bc, 'primary_review': review, 'reviewed_candidate_universe': summary}, indent=2))
          PY
      - name: Record acquisition boundary
        run: |
          echo "British Council Partner School status remains supporting discovery/contact evidence only."
          echo "Discovery rows are source records, not unique-institution claims; campus/division overlaps are resolved later in D2.2."
          echo "Only exact leads with separately checked-in high-confidence primary/recognized evidence can receive eligibility state."
          echo "The historical 106-row classified source universe remains independently reproducible and unchanged."
      - uses: actions/upload-artifact@v4
        with:
          name: edu-data-2-british-council-discovery
          path: |
            artifacts/international/british-council-browser-discovery/
            artifacts/international/british-council-candidate-universe/
            artifacts/international/british-council-primary-scope-review/
            artifacts/international/british-council-reviewed-candidate-universe/
          if-no-files-found: error
