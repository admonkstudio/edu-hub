name: EDU-DATA-2 Incremental Identity Review

on:
  push:
    branches:
      - edu-data-2-international-registry
    paths:
      - 'tools/data-acquisition/international/build_authoritative_seed.py'
      - 'tools/data-acquisition/international/apply_ib_detail_batches.py'
      - 'tools/data-acquisition/international/apply_bso_scope_review.py'
      - 'tools/data-acquisition/international/build_accreditor_expansion.py'
      - 'tools/data-acquisition/international/apply_accreditor_scope_review.py'
      - 'tools/data-acquisition/international/build_extended_identity_artifacts.py'
      - 'tools/data-acquisition/international/build_hierarchy_review_artifacts.py'
      - 'tools/data-acquisition/international/build_incremental_identity_review_artifacts.py'
      - 'tools/data-acquisition/international/validate_known_distinct_identities.py'
      - 'tools/data-acquisition/international/seeds/ib-detail-evidence-*-batch*.json'
      - 'tools/data-acquisition/international/seeds/bso-scope-review-2026-09-15.json'
      - 'tools/data-acquisition/international/seeds/accreditor-scope-review-2026-09-15.json'
      - 'tools/data-acquisition/international/seeds/identity-review-decisions-2026-09-15.json'
      - 'tools/data-acquisition/international/seeds/single-source-identity-decisions-2026-09-15.json'
      - 'tools/data-acquisition/international/seeds/single-source-identity-decisions-*-batch*.json'
      - 'tools/data-acquisition/international/seeds/division-review-decisions-2026-09-15.json'
      - 'tools/data-acquisition/international/seeds/hierarchy-review-decisions-2026-09-15.json'
      - 'tools/data-acquisition/international/seeds/known-distinct-identity-decisions-2026-09-15.json'
      - '.github/workflows/edu-data-2-incremental-identity-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    name: Validate incremental explicit identity review batches
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile data tools
        run: |
          python -m py_compile tools/data-acquisition/international/build_authoritative_seed.py
          python -m py_compile tools/data-acquisition/international/apply_ib_detail_batches.py
          python -m py_compile tools/data-acquisition/international/apply_bso_scope_review.py
          python -m py_compile tools/data-acquisition/international/build_accreditor_expansion.py
          python -m py_compile tools/data-acquisition/international/apply_accreditor_scope_review.py
          python -m py_compile tools/data-acquisition/international/build_extended_identity_artifacts.py
          python -m py_compile tools/data-acquisition/international/build_hierarchy_review_artifacts.py
          python -m py_compile tools/data-acquisition/international/build_incremental_identity_review_artifacts.py
          python -m py_compile tools/data-acquisition/international/validate_known_distinct_identities.py
      - name: Build fully scope-reviewed 106-row source universe
        run: |
          python tools/data-acquisition/international/build_authoritative_seed.py --output-dir artifacts/international
          python tools/data-acquisition/international/apply_ib_detail_batches.py
          python tools/data-acquisition/international/apply_bso_scope_review.py
          python tools/data-acquisition/international/build_accreditor_expansion.py \
            --base artifacts/international/bso-scope-review/authoritative-source-candidates-with-bso-scope-review.jsonl \
            --output-dir artifacts/international/bso-scope-review/accreditor-expansion
          python tools/data-acquisition/international/apply_accreditor_scope_review.py
      - name: Rebuild accepted D2.2 base
        run: |
          python tools/data-acquisition/international/build_extended_identity_artifacts.py
          python tools/data-acquisition/international/build_hierarchy_review_artifacts.py
          python tools/data-acquisition/international/validate_known_distinct_identities.py
      - name: Apply incremental single-source identity review batches
        run: python tools/data-acquisition/international/build_incremental_identity_review_artifacts.py
      - name: Assert incremental identity safety contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/international/incremental-identity-review')
          summary = json.loads((root/'incremental-identity-summary.json').read_text(encoding='utf-8'))
          institutions = [json.loads(line) for line in (root/'reviewed-institution-drafts.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          divisions = [json.loads(line) for line in (root/'reviewed-school-division-drafts.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          memberships = [json.loads(line) for line in (root/'incremental-source-memberships.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          queue = [json.loads(line) for line in (root/'unreviewed-source-queue.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]

          assert summary['source_universe_rows'] == 106
          assert summary['base_reviewed_institution_drafts'] == 20
          assert summary['base_reviewed_division_drafts'] == 10
          assert summary['base_reviewed_unique_source_rows'] == 31
          assert summary['incremental_review_batches'] == 1
          assert summary['new_explicit_single_source_identities'] == len(memberships) == 4
          assert summary['reviewed_institution_drafts'] == len(institutions) == 24
          assert summary['reviewed_division_drafts'] == len(divisions) == 10
          assert summary['reviewed_unique_source_rows'] == 35
          assert summary['unreviewed_source_rows'] == len(queue) == 71
          assert summary['full_universe_unique_institution_count_claimed'] is None
          assert summary['absence_of_match_treated_as_uniqueness_proof'] is False
          assert summary['automatic_identity_creation_performed'] is False
          assert summary['automatic_merges_performed'] == 0
          assert summary['canonical_database_rows_written'] == 0
          assert summary['runtime_database_mutation_performed'] is False
          assert summary['public_projection_rows_created'] == 0

          expected = {
              'deutsche-evangelische-oberschule-kairo',
              'deutsche-schule-der-borromaeerinnen-kairo',
              'deutsche-schule-der-borromaeerinnen-alexandria',
              'europaschule-kairo',
          }
          actual = {row['review_identity_key'] for row in memberships}
          assert actual == expected
          by_key = {row['review_identity_key']: row for row in institutions}
          assert expected <= set(by_key)
          assert all(by_key[key]['uniqueness_inferred_from_absence_of_match'] is False for key in expected)
          assert len({row['draft_institution_id'] for row in institutions}) == len(institutions)
          assert len({(row['source_id'], row['source_record_id']) for row in memberships}) == len(memberships)

          distinct_root = Path('artifacts/international/known-distinct-review')
          distinct = json.loads((distinct_root/'known-distinct-summary.json').read_text(encoding='utf-8'))
          assert distinct['validated_distinct_pairs'] == 2
          assert distinct['automatic_merges_performed'] == 0

          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: edu-data-2-incremental-identity-review
          path: |
            artifacts/international/incremental-identity-review/
            artifacts/international/known-distinct-review/
          if-no-files-found: error
