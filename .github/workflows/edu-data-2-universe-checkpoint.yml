name: EDU-DATA-2 D2.1 Universe Checkpoint

on:
  push:
    branches:
      - edu-data-2-international-registry
    paths:
      - 'tools/data-acquisition/international/build_d2_1_universe_checkpoint.py'
      - 'tools/data-acquisition/international/apply_substantive_international_he_review.py'
      - 'tools/data-acquisition/international/apply_mansoura_college_topology_review.py'
      - 'tools/data-acquisition/international/extract_cognia_egypt_registry.py'
      - 'tools/data-acquisition/international/acquire_overture_egypt_international_education.py'
      - 'tools/data-acquisition/international/build_overture_gap_review.py'
      - 'tools/data-acquisition/international/apply_overture_gap_resolutions.py'
      - 'tools/data-acquisition/international/apply_overture_higher_ed_resolutions.py'
      - 'tools/data-acquisition/international/build_british_council_browser_discovery.py'
      - 'tools/data-acquisition/international/apply_british_council_primary_scope_review.py'
      - 'tools/data-acquisition/international/build_candidate_universe.py'
      - 'tools/data-acquisition/international/seeds/cognia-egypt-milestones-2026-2027.json'
      - 'tools/data-acquisition/international/seeds/canadian-offshore-schools-egypt-2026-09-15.json'
      - 'tools/data-acquisition/international/seeds/zfa-german-schools-abroad-egypt-2026-09-15.json'
      - 'tools/data-acquisition/international/seeds/substantive-international-higher-ed-review-*.json'
      - 'tools/data-acquisition/international/seeds/mansoura-college-topology-review-*.json'
      - 'tools/data-acquisition/international/seeds/overture-gap-resolution-*.json'
      - 'tools/data-acquisition/international/seeds/overture-higher-ed-scope-review-*.json'
      - 'tools/data-acquisition/international/seeds/british-council-browser-discovery-*.json'
      - 'tools/data-acquisition/international/seeds/british-council-primary-scope-review-*.json'
      - '.github/workflows/edu-data-2-universe-checkpoint.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checkpoint:
    name: Build current D2.1 source/lead universe checkpoint
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source adapters
        run: |
          pip install playwright duckdb
          python -m playwright install --with-deps chromium
      - name: Compile checkpoint tools
        run: |
          python -m py_compile tools/data-acquisition/international/build_authoritative_seed.py
          python -m py_compile tools/data-acquisition/international/apply_ib_detail_batches.py
          python -m py_compile tools/data-acquisition/international/apply_bso_scope_review.py
          python -m py_compile tools/data-acquisition/international/build_accreditor_expansion.py
          python -m py_compile tools/data-acquisition/international/apply_accreditor_scope_review.py
          python -m py_compile tools/data-acquisition/international/build_british_council_browser_discovery.py
          python -m py_compile tools/data-acquisition/international/apply_british_council_primary_scope_review.py
          python -m py_compile tools/data-acquisition/international/build_candidate_universe.py
          python -m py_compile tools/data-acquisition/international/extract_cognia_egypt_registry.py
          python -m py_compile tools/data-acquisition/international/build_d2_1_universe_checkpoint.py
          python -m py_compile tools/data-acquisition/international/apply_substantive_international_he_review.py
          python -m py_compile tools/data-acquisition/international/apply_mansoura_college_topology_review.py
          python -m py_compile tools/data-acquisition/international/acquire_overture_egypt_international_education.py
          python -m py_compile tools/data-acquisition/international/build_overture_gap_review.py
          python -m py_compile tools/data-acquisition/international/apply_overture_gap_resolutions.py
          python -m py_compile tools/data-acquisition/international/apply_overture_higher_ed_resolutions.py
      - name: Rebuild classified strong layer and 226-row British Council layer
        run: |
          python tools/data-acquisition/international/build_authoritative_seed.py --output-dir artifacts/international
          python tools/data-acquisition/international/apply_ib_detail_batches.py
          python tools/data-acquisition/international/apply_bso_scope_review.py
          python tools/data-acquisition/international/build_accreditor_expansion.py \
            --base artifacts/international/bso-scope-review/authoritative-source-candidates-with-bso-scope-review.jsonl \
            --output-dir artifacts/international/bso-scope-review/accreditor-expansion
          python tools/data-acquisition/international/apply_accreditor_scope_review.py
          python tools/data-acquisition/international/build_british_council_browser_discovery.py
          python tools/data-acquisition/international/apply_british_council_primary_scope_review.py
          python tools/data-acquisition/international/build_candidate_universe.py \
            --authoritative artifacts/international/accreditor-scope-review/reviewed-source-universe.jsonl \
            --lead-file artifacts/international/british-council-primary-scope-review/british-council-leads-with-primary-review.jsonl \
            --output-dir artifacts/international/british-council-reviewed-candidate-universe
      - name: Extract complete official Cognia Egypt registry
        run: python tools/data-acquisition/international/extract_cognia_egypt_registry.py
      - name: Build supersession-safe D2.1 checkpoint with Canadian and ZfA evidence
        run: python tools/data-acquisition/international/build_d2_1_universe_checkpoint.py
      - name: Apply reviewed substantive-international higher-ed evidence
        run: python tools/data-acquisition/international/apply_substantive_international_he_review.py
      - name: Acquire Egypt-only Overture supporting discovery
        run: python tools/data-acquisition/international/acquire_overture_egypt_international_education.py
      - name: Apply reviewed Mansoura College provider and school topology
        run: python tools/data-acquisition/international/apply_mansoura_college_topology_review.py
      - name: Compare Overture discovery to current universe
        run: python tools/data-acquisition/international/build_overture_gap_review.py
      - name: Apply explicit Overture high-signal school review decisions
        run: |
          python tools/data-acquisition/international/apply_overture_gap_resolutions.py \
            --decisions \
              tools/data-acquisition/international/seeds/overture-gap-resolution-2026-09-15-batch1.json \
              tools/data-acquisition/international/seeds/overture-gap-resolution-2026-09-15-batch2.json \
              tools/data-acquisition/international/seeds/overture-gap-resolution-2026-09-15-batch3.json \
              tools/data-acquisition/international/seeds/overture-gap-resolution-2026-09-15-batch4.json \
              tools/data-acquisition/international/seeds/overture-gap-resolution-2026-09-15-batch5.json \
              tools/data-acquisition/international/seeds/overture-gap-resolution-2026-09-15-batch6.json \
              tools/data-acquisition/international/seeds/overture-gap-resolution-2026-09-16-batch7.json \
              tools/data-acquisition/international/seeds/overture-gap-resolution-2026-09-16-batch8.json
      - name: Apply complete Overture higher-ed review decisions
        run: python tools/data-acquisition/international/apply_overture_higher_ed_resolutions.py
      - name: Assert checkpoint counts, Mansoura topology, Overture gaps and safety boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/international/d2-1-universe-checkpoint')
          summary = json.loads((root/'checkpoint-summary.json').read_text(encoding='utf-8'))
          supersession = json.loads((root/'cognia-source-family-supersession.json').read_text(encoding='utf-8'))
          canadian = json.loads((root/'canadian-offshore-source-family.json').read_text(encoding='utf-8'))
          zfa = json.loads((root/'zfa-german-schools-abroad-source-family.json').read_text(encoding='utf-8'))
          he_family = json.loads((root/'substantive-international-he-source-family.json').read_text(encoding='utf-8'))
          mansoura = json.loads((root/'mansoura-college-topology-source-family.json').read_text(encoding='utf-8'))
          rows = [json.loads(line) for line in (root/'source-lead-universe.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          geo = json.loads(Path('artifacts/international/overture-egypt-international-education/overture-egypt-international-education.json').read_text(encoding='utf-8'))
          gaps = json.loads(Path('artifacts/international/overture-gap-review/gap-review-summary.json').read_text(encoding='utf-8'))
          resolutions = json.loads(Path('artifacts/international/overture-gap-resolution/resolution-summary.json').read_text(encoding='utf-8'))
          he_review = json.loads(Path('artifacts/international/overture-higher-ed-resolution/higher-ed-review-summary.json').read_text(encoding='utf-8'))

          assert summary['foundational_authoritative_seed_rows'] == 96
          assert summary['historical_classified_strong_rows'] == 106
          assert summary['previous_reviewed_source_lead_rows'] == 332
          assert summary['pre_canadian_current_source_lead_rows'] == 584
          assert summary['pre_zfa_current_source_lead_rows'] == 590
          assert summary['pre_substantive_international_he_source_lead_rows'] == 597
          assert summary['pre_mansoura_topology_source_lead_rows'] == 602
          assert summary['british_council_rows'] == 226
          assert summary['cognia_full_registry_rows'] == 256
          assert summary['cognia_milestone_rows_superseded'] == 4
          assert summary['cognia_new_rows_beyond_milestone_subset'] == 252
          assert summary['canadian_authorized_offshore_school_rows'] == 6
          assert summary['zfa_german_schools_abroad_rows'] == 7
          assert summary['substantive_international_he_review_rows'] == 5
          assert summary['mansoura_college_reviewed_international_school_rows'] == 2
          assert summary['mansoura_college_provider_units_reviewed'] == 4
          assert summary['mansoura_college_provider_umbrella_materialized_as_institution'] is False
          assert summary['current_source_lead_rows'] == 604
          assert summary['scope_or_lead_state_counts'] == {'eligible': 135, 'excluded': 3, 'supporting_candidate': 466}
          assert len(rows) == 604
          assert len(supersession) == 4

          assert canadian['records_count'] == 6
          assert zfa['records_count'] == 7
          assert he_family['records_count'] == 5
          assert mansoura['new_universe_source_rows'] == 2
          assert mansoura['new_eligible_source_rows'] == 2
          assert mansoura['provider_umbrella_is_separate_canonical_institution'] is False
          assert mansoura['national_units_added_to_active_universe'] == 0
          assert mansoura['british_council_partner_status_granted_eligibility'] is False
          assert mansoura['cognia_alone_granted_eligibility'] is False
          assert mansoura['overture_granted_eligibility'] is False
          assert summary['unique_institutions_claimed'] is None
          assert mansoura['unique_institutions_claimed'] is None

          mansoura_rows = {
              (r.get('source_id'), r.get('source_record_id')): r
              for r in rows
              if str(r.get('source_id') or '').startswith('reviewed_mansoura_college_')
          }
          assert set(mansoura_rows) == {
              ('reviewed_mansoura_college_british_school_2026_09_15', 'pearson-centre-92720'),
              ('reviewed_mansoura_college_american_school_2026_09_15', 'mcas-reviewed-2026-09-15'),
          }
          assert mansoura_rows[('reviewed_mansoura_college_british_school_2026_09_15', 'pearson-centre-92720')]['name_en'] == 'Mansoura College British School'
          assert mansoura_rows[('reviewed_mansoura_college_british_school_2026_09_15', 'pearson-centre-92720')]['recognized_identifier'] == 'Pearson centre 92720'
          assert mansoura_rows[('reviewed_mansoura_college_american_school_2026_09_15', 'mcas-reviewed-2026-09-15')]['name_en'] == 'Mansoura College 2 International American School'

          existing_bc = [r for r in rows if r.get('source_id') == 'british_council_partner_schools_egypt_2026_09' and r.get('source_record_id') == 'bcps2026:mansoura-college-modern']
          existing_cognia = [r for r in rows if r.get('source_id') == 'cognia_accreditation_registry_egypt_2026_09_15' and r.get('source_record_id') == 'registry-row-147']
          assert len(existing_bc) == 1 and (existing_bc[0].get('scope_state') or existing_bc[0].get('lead_state')) == 'supporting_candidate'
          assert len(existing_cognia) == 1 and (existing_cognia[0].get('scope_state') or existing_cognia[0].get('lead_state')) == 'supporting_candidate'

          assert zfa['current_das_membership_is_distinct_from_current_exam_authorization'] is True
          assert zfa['hurghada_sek_i_last_conducted_school_year'] == '2024/2025'
          hurghada = [r for r in rows if r.get('source_id') == 'zfa_german_schools_abroad_egypt_2026_09_15' and 'hurghada' in (r.get('name_en') or '').lower()]
          assert len(hurghada) == 1
          assert hurghada[0]['kmk_sek_i_lifecycle']['current_sek_i_exam_authorization_after_2024_2025'] == 'not_asserted'

          assert geo['country_filter'] == 'EG'
          assert geo['bbox_candidate_rows'] == 1121
          assert geo['non_egypt_rows_rejected'] == 79
          assert geo['record_count'] == 1042
          assert all('EG' in row['address_countries'] for row in geo['records'])

          assert gaps['current_universe_source_rows'] == 604
          assert gaps['overture_egypt_rows'] == 1042
          assert gaps['exact_normalized_name_overlap_rows'] == 141
          assert gaps['unmatched_supporting_rows'] == 901
          assert gaps['unmatched_unique_normalized_names'] == 865
          assert gaps['high_signal_preuniversity_rows'] == 266
          assert gaps['higher_ed_scope_review_rows'] == 70
          assert gaps['lower_priority_supporting_rows'] == 565
          assert gaps['fuzzy_matches_performed'] == 0
          assert gaps['overture_rows_auto_added_to_universe'] == 0

          assert resolutions['input_high_signal_rows'] == 266
          assert resolutions['reviewed_rows'] == 75
          assert resolutions['resolved_existing_or_authoritative_rows'] == 73
          assert resolutions['reviewed_still_unresolved_rows'] == 2
          assert resolutions['unreviewed_high_signal_rows'] == 191
          assert resolutions['outstanding_high_signal_rows'] == 193
          assert resolutions['decision_counts'] == {
              'covered_by_current_authoritative_source_family': 7,
              'existing_provider_division_requires_d2_2_review': 21,
              'existing_source_identity_alias': 45,
              'unresolved_supporting_only': 2,
          }

          assert he_review['input_higher_ed_rows'] == 70
          assert he_review['reviewed_rows'] == 70
          assert he_review['higher_ed_queue_outstanding_rows'] == 0
          assert he_review['existing_eligible_he_alias_or_subunit_rows'] == 14
          assert he_review['rerouted_preuniversity_existing_rows'] == 1
          assert he_review['rerouted_preuniversity_unresolved_rows'] == 1
          assert he_review['out_of_scope_egyptian_he_rows'] == 21
          assert he_review['supporting_only_no_qualifying_he_rows'] == 33

          for obj in (summary, gaps, resolutions, he_review, he_family, mansoura):
              assert obj['canonical_institutions_created'] == 0
              assert obj['database_mutation_performed'] is False
              assert obj['public_projection_rows_created'] == 0
          assert summary['automatic_identity_merges_performed'] == 0
          assert summary['mansoura_rows_auto_identity_merged'] == 0
          assert gaps['automatic_identity_merges_performed'] == 0
          assert resolutions['automatic_identity_merges_performed'] == 0
          assert he_review['automatic_identity_merges_performed'] == 0
          assert he_family['automatic_identity_merges_performed'] == 0
          assert mansoura['automatic_identity_merges_performed'] == 0
          assert summary['d2_1_complete'] is False

          print(json.dumps({
              'checkpoint': summary,
              'mansoura_topology': mansoura,
              'gap_review': gaps,
              'school_gap_resolution': resolutions,
              'higher_ed_gap_resolution': he_review,
          }, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: edu-data-2-d2-1-universe-checkpoint
          path: |
            artifacts/international/d2-1-universe-checkpoint/
            artifacts/international/cognia-egypt-registry/
            artifacts/international/british-council-browser-discovery/british-council-browser-summary.json
            artifacts/international/british-council-primary-scope-review/british-council-primary-scope-summary.json
            artifacts/international/overture-egypt-international-education/
            artifacts/international/overture-gap-review/
            artifacts/international/overture-gap-resolution/
            artifacts/international/overture-higher-ed-resolution/
          if-no-files-found: error
