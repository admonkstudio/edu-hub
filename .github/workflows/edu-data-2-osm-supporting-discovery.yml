name: EDU-DATA-2 OSM Supporting Discovery

on:
  push:
    branches:
      - edu-data-2-international-registry
    paths:
      - 'tools/data-acquisition/international/acquire_osm_egypt_international_education.py'
      - '.github/workflows/edu-data-2-osm-supporting-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    name: Diagnose supporting international-education discovery from OSM
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependency
        run: pip install requests
      - name: Compile acquisition tool
        run: python -m py_compile tools/data-acquisition/international/acquire_osm_egypt_international_education.py
      - name: Attempt read-only OpenStreetMap tiled Overpass coverage
        run: python tools/data-acquisition/international/acquire_osm_egypt_international_education.py --timeout-s 6
      - name: Assert diagnostic and supporting-only safety boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/international/osm-egypt-international-education/osm-egypt-international-education.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          assert data['work_package'] == 'D2.1_osm_egypt_international_education_supporting_discovery'
          assert data['source'] == 'OpenStreetMap via public Overpass API'
          assert data['tile_count'] == 12
          assert data['successful_tile_count'] + data['failed_tile_count'] == 12
          assert data['coverage_state'] in {'complete','partial_public_overpass_availability','environment_blocked_all_tiles'}
          assert data['coverage_complete'] is (data['coverage_state'] == 'complete')
          assert data['record_count'] == len(data['records'])
          if data['coverage_state'] == 'environment_blocked_all_tiles':
              assert data['successful_tile_count'] == 0
              assert data['failed_tile_count'] == 12
              assert data['record_count'] == 0
          assert all(r['international_eligibility_granted'] is False for r in data['records'])
          assert data['rules']['osm_auto_international_eligibility'] is False
          assert data['rules']['osm_auto_identity_merge'] is False
          assert data['rules']['osm_auto_canonical_creation'] is False
          assert data['rules']['failed_coverage_never_interpreted_as_zero_candidates'] is True
          assert data['rules']['coordinates_require_identity_review_before_attachment'] is True
          assert data['database_mutation_performed'] is False
          assert data['public_projection_rows_created'] == 0
          print(json.dumps({
              'coverage_state': data['coverage_state'],
              'successful_tile_count': data['successful_tile_count'],
              'failed_tile_count': data['failed_tile_count'],
              'record_count': data['record_count'],
          }, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: edu-data-2-osm-supporting-discovery
          path: artifacts/international/osm-egypt-international-education/
          if-no-files-found: error
