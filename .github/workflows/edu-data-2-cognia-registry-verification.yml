name: EDU-DATA-2 Cognia Registry Verification Queue

on:
  push:
    branches:
      - edu-data-2-international-registry
    paths:
      - 'tools/data-acquisition/international/build_cognia_registry_verification_queue.py'
      - 'tools/data-acquisition/international/seeds/cognia-registry-verification-queue-*.json'
      - '.github/workflows/edu-data-2-cognia-registry-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile builder
        run: python -m py_compile tools/data-acquisition/international/build_cognia_registry_verification_queue.py
      - name: Build verification queue
        run: python tools/data-acquisition/international/build_cognia_registry_verification_queue.py
      - name: Assert discovery-only safety boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('artifacts/international/cognia-registry-verification')
          summary = json.loads((root/'cognia-registry-verification-summary.json').read_text(encoding='utf-8'))
          rows = [json.loads(line) for line in (root/'cognia-registry-verification-queue.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]

          assert summary['queue_rows'] == len(rows) == 24
          assert summary['institution_primary_accreditation_claims'] == 22
          assert summary['engagement_review_only_rows'] == 2
          assert summary['official_registry_verified_rows'] == 0
          assert summary['international_eligibility_granted'] == 0
          assert summary['canonical_institutions_created'] == 0
          assert summary['automatic_merges_performed'] == 0
          assert summary['database_mutation_performed'] is False
          assert summary['public_projection_rows_created'] == 0
          assert len({row['review_id'] for row in rows}) == len(rows)
          assert all(row['official_registry_verification_state'] == 'pending' for row in rows)
          assert all(row['accreditation_confirmed_from_cognia'] is False for row in rows)
          assert all(row['international_eligibility_granted'] is False for row in rows)
          assert all(row['canonical_identity_created'] is False for row in rows)
          assert all(row['automatic_merge_performed'] is False for row in rows)
          assert all(row['database_mutation_performed'] is False for row in rows)
          assert all(row['public_projection_performed'] is False for row in rows)

          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: edu-data-2-cognia-registry-verification
          path: artifacts/international/cognia-registry-verification/
          if-no-files-found: error
