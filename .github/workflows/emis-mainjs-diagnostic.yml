name: EMIS homepage JS route diagnostic

on:
  push:
    branches:
      - data-acquisition-egypt-v3
    paths:
      - ".github/workflows/emis-mainjs-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect EMIS main.js
        run: |
          python - <<'PY'
          import re,requests
          from urllib.parse import urljoin
          s=requests.Session(); s.headers['User-Agent']='EduHubResearchBot/1.3 (+https://github.com/admonkstudio/edu-hub; public-source-diagnostic)'
          for u in ('https://emis.gov.eg/main.js','http://emis.gov.eg/main.js'):
              print('\n===',u,'===',flush=True)
              try:
                  r=s.get(u,timeout=60,allow_redirects=True)
                  print('STATUS',r.status_code,'FINAL',r.url,'LEN',len(r.text),'TYPE',r.headers.get('content-type'),flush=True)
                  r.raise_for_status()
              except Exception as e:
                  print('ERROR',repr(e),flush=True); continue
              txt=r.text
              terms=('school','schools','مدارس','دليل','search.emis','schpriv','sch','directory')
              for term in terms:
                  pos=txt.lower().find(term.lower())
                  if pos>=0:
                      print('MATCH',term,txt[max(0,pos-1200):pos+5000].replace('\n',' ')[:6500],flush=True)
              refs=set()
              for m in re.findall(r"['\"]([^'\"]+)['\"]",txt):
                  low=m.lower()
                  if any(k in low for k in ('school','search.emis','schpriv','مدارس','emis.gov.eg')):
                      refs.add(urljoin(r.url,m))
              for ref in sorted(refs): print('ROUTE_REF',ref,flush=True)
          PY
